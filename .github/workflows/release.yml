name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing ref to release (e.g. v1.1.0 or main)'
        required: true

permissions:
  contents: read

jobs:
  # Build + test + GitHub Release. No store credentials are available here, so
  # dependency install/build/test steps can never read them.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Build artifacts (Chrome zip + Firefox zip)
        run: npm run pack:zip

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          FILES="release/gitpreview-v${{ steps.ver.outputs.version }}-chrome.zip release/gitpreview-v${{ steps.ver.outputs.version }}-firefox.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "GitPreview $TAG" --generate-notes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          if-no-files-found: error
          path: |
            dist
            dist-firefox
            release
            amo-metadata.json

  # Store publishing. Runs on its own runner; the only steps that ever see store
  # credentials are the publish steps below (job-level env, gated by `env.X`).
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: release-package

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ── Chrome Web Store ────────────────────────────────────────────────
      # Secrets: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN,
      #          CWS_EXTENSION_ID, CWS_PUBLISHER_ID
      - name: Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        continue-on-error: true
        run: |
          ZIP="release/gitpreview-v${{ steps.ver.outputs.version }}-chrome.zip"
          npx --yes chrome-webstore-upload-cli@4 upload --source "$ZIP"
          npx --yes chrome-webstore-upload-cli@4 publish

      # ── Firefox Add-ons (AMO) ───────────────────────────────────────────
      # Secrets: AMO_API_KEY (JWT issuer), AMO_API_SECRET (JWT secret)
      # --approval-timeout 0 submits for review without waiting for it.
      - name: Publish to Firefox AMO
        if: env.AMO_API_KEY != ''
        continue-on-error: true
        run: |
          npx --yes web-ext@10.7.0 sign \
            --source-dir dist-firefox \
            --artifacts-dir web-ext-artifacts \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --approval-timeout 0 \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET"

      # ── Microsoft Edge Add-ons ──────────────────────────────────────────
      # Secrets: EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
      - name: Publish to Microsoft Edge Add-ons
        if: env.EDGE_CLIENT_ID != ''
        continue-on-error: true
        env:
          RELEASE_NOTES: GitPreview v${{ steps.ver.outputs.version }}
        run: |
          node scripts/publish-edge.mjs "release/gitpreview-v${{ steps.ver.outputs.version }}-chrome.zip"

      # ── Opera ───────────────────────────────────────────────────────────
      # Opera Add-ons has no public upload API; publish manually at
      # https://addons.opera.com/developer/ using the Chrome zip.
      # Brave and Vivaldi install from the Chrome Web Store, so no extra step.
